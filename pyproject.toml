[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-marauder"
version = "0.1.0"
description = "Debian wireless field console for Arduino UNO Q"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Q-Marauder contributors"}]
dependencies = []

[project.scripts]
q-marauder = "qmarauder.__main__:main"

[tool.setuptools.package-data]
qmarauder = ["web/*", "web/assets/*", "features.json"]
